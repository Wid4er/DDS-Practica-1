<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrito de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <nav th:replace="~{fragments/navigation :: menu}"></nav>
        <h1 class="text-center my-5">Carrito de Compras</h1>
        <p sec:authorize="isAnonymous()" class="alert alert-info">
            Este carrito es temporal. <a th:href="@{/login}">Inicia sesión</a> para usar tu carrito guardado.
        </p>
        <div class="mb-4">
            <a th:href="@{/products}" class="btn btn-secondary">Continuar Comprando</a>
        </div>
        <div>
            <p th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">El carrito está vacío.</p>
            <ul class="list-group">
                <li th:each="item : ${cartItems}" class="list-group-item d-flex flex-wrap gap-3 justify-content-between align-items-center">
                    <div>
                        <strong th:text="${item.product.name}">Nombre del Producto</strong>
                        <div th:text="${#numbers.formatDecimal(item.product.price, 1, 2)} + ' € por unidad'">Precio</div>
                    </div>
                    <form th:action="@{/cart/update/{id}(id=${item.product.id})}" method="post" class="d-flex align-items-center gap-2">
                        <label th:for="${'quantity-' + item.product.id}">Cantidad</label>
                        <input th:id="${'quantity-' + item.product.id}" type="number" name="quantity"
                               th:value="${item.quantity}" min="1" step="1" required class="form-control" style="width: 85px;">
                        <button type="submit" class="btn btn-outline-primary">Actualizar</button>
                    </form>
                    <span th:text="'Subtotal: ' + ${#numbers.formatDecimal(item.subtotal, 1, 2)} + ' €'">Subtotal</span>
                    <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </li>
            </ul>
            <p th:if="${!#lists.isEmpty(cartItems)}" class="text-end fw-bold mt-3"
               th:text="'Total: ' + ${#numbers.formatDecimal(total, 1, 2)} + ' €'">Total</p>
        </div>
    </div>
</body>
</html>
