<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
            color: #222;
        }

        header {
            background-color: #003366;
            color: white;
            padding: 18px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        main {
            max-width: 450px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border: 1px solid #ccc;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #999;
        }

        button {
            margin-top: 20px;
            padding: 8px 16px;
            border: 1px solid #777;
            background-color: #e5e5e5;
            cursor: pointer;
        }

        button:hover {
            background-color: #d5d5d5;
        }

        a {
            color: #004b87;
        }

        .mensaje {
            padding: 10px;
            border: 1px solid #aaa;
            background-color: #f5f5f5;
            margin-bottom: 15px;
        }

        .error {
            color: #900;
            border-color: #b88;
            background-color: #fff0f0;
        }

        .volver {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>Acceso a la aplicación</h1>
</header>

<main>

    <h2>Identificación</h2>

    <div class="mensaje error"
         th:if="${param.error}">
        Usuario o contraseña incorrectos.
    </div>

    <div class="mensaje"
         th:if="${param.logout}">
        La sesión se ha cerrado correctamente.
    </div>

    <form th:action="@{/login}" method="post">

        <label for="username">Usuario</label>
        <input id="username"
               type="text"
               name="username"
               required>

        <label for="password">Contraseña</label>
        <input id="password"
               type="password"
               name="password"
               required>

        <button type="submit">
            Acceder
        </button>

    </form>

    <div class="volver">
        <a th:href="@{/products}">
            Volver al listado de productos
        </a>
    </div>

</main>

</body>
</html>
