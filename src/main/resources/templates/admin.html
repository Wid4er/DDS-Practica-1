<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <nav th:replace="~{fragments/navigation :: menu}"></nav>
        <a th:href="@{/admin/export}" class="btn btn-primary">Descargar Base de Datos (SQL)</a>

        <!-- Título Principal -->
        <h1 class="text-center mb-5">Administrar Productos</h1>

        <!-- Formulario para Agregar Producto -->
        <div class="row mb-5">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Agregar Nuevo Producto</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/products/add}" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre del Producto</label>
                                <input type="text" id="name" name="name" class="form-control" placeholder="Nombre del producto" required />
                            </div>
                            <div class="mb-3">
                                <label for="price" class="form-label">Precio (€)</label>
                                <input type="number" id="price" name="price" step="0.01" min="0" class="form-control" placeholder="0.30" required />
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Agregar Producto</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Productos Existentes -->
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Productos Existentes</h5>
                    </div>
                    <p th:if="${#lists.isEmpty(products)}" class="p-3 mb-0">Todavía no hay productos.</p>
                    <ul class="list-group list-group-flush">
                        <li th:each="product : ${products}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong th:text="${product.name}">Nombre del Producto</strong>
                                    <p class="mb-0 text-muted" th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' €'">Precio del Producto</p>
                                </div>
                                <div>
                                    <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-warning btn-sm">Editar</a>
                                    <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post" class="d-inline-block">
                                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                                    </form>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
