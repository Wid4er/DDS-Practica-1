<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de productos</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
            color: #222;
        }

        header {
            background-color: #003366;
            color: white;
            padding: 18px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border: 1px solid #ccc;
        }

        .menu {
            margin-bottom: 25px;
        }

        a {
            color: #004b87;
        }

        .boton {
            display: inline-block;
            padding: 8px 14px;
            margin-right: 5px;
            background-color: #e5e5e5;
            border: 1px solid #999;
            color: #222;
            text-decoration: none;
        }

        .boton:hover {
            background-color: #d5d5d5;
        }

        .buscar {
            padding: 15px;
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        input {
            padding: 7px;
            border: 1px solid #999;
        }

        button {
            padding: 7px 14px;
            border: 1px solid #777;
            background-color: #e5e5e5;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background-color: #e4e8ec;
            text-align: left;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 10px;
        }

        .acciones a {
            margin-right: 12px;
        }

        .eliminar {
            color: #a00000;
        }

        footer {
            margin-top: 30px;
            border-top: 1px solid #ccc;
            padding-top: 15px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>Gestión de productos</h1>
</header>

<main>

    <div class="menu">
        <a class="boton" th:href="@{/products/new}">
            Añadir producto
        </a>

        <a class="boton" th:href="@{/cart}">
            Ver carrito
        </a>
    </div>

    <div class="buscar">

        <strong>Buscar productos</strong>

        <form th:action="@{/products/search}" method="get">

            <br>

            <input type="text"
                   name="name"
                   placeholder="Nombre del producto">

            <button type="submit">Buscar</button>

            <a th:href="@{/products}">
                Mostrar todos
            </a>

        </form>

    </div>

    <h2>Listado de productos</h2>

    <table th:if="${!#lists.isEmpty(products)}">

        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="product : ${products}">

                <td th:text="${product.id}"></td>

                <td th:text="${product.name}"></td>

                <td>
                    <span th:text="${product.price}"></span> €
                </td>

                <td class="acciones">

					<form th:action="@{/cart/add/{id}(id=${product.id})}"
					      method="get"
					      style="display:inline;">

					    <input type="number"
					           name="quantity"
					           value="1"
					           min="1"
					           style="width:55px;">

					    <button type="submit">
					        Añadir al carrito
					    </button>

					</form>

                    <a th:href="@{/products/edit/{id}(id=${product.id})}">
                        Editar
                    </a>

                    <a class="eliminar"
                       th:href="@{/products/delete/{id}(id=${product.id})}">
                        Eliminar
                    </a>

                </td>

            </tr>

        </tbody>

    </table>

    <p th:if="${#lists.isEmpty(products)}">
        No hay productos disponibles.
    </p>

    <footer>
        Aplicación de gestión de productos
    </footer>

</main>

</body>
</html>
