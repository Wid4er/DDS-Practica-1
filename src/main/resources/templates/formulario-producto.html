<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
            color: #222;
        }

        header {
            background-color: #003366;
            color: white;
            padding: 18px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        main {
            max-width: 650px;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border: 1px solid #ccc;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #999;
        }

        .acciones {
            margin-top: 25px;
        }

        button, .boton {
            padding: 8px 15px;
            border: 1px solid #777;
            background-color: #e5e5e5;
            color: #222;
            text-decoration: none;
            cursor: pointer;
            margin-right: 5px;
        }

        button:hover, .boton:hover {
            background-color: #d5d5d5;
        }
    </style>
</head>

<body>

<header>
    <h1>Gestión de productos</h1>
</header>

<main>

    <h2 th:text="${product.id == null ? 'Nuevo producto' : 'Editar producto'}">
        Producto
    </h2>

    <form th:object="${product}"
          th:action="${product.id == null} ? @{/products/add} : @{/products/edit}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <label for="name">Nombre</label>
        <input id="name"
               type="text"
               th:field="*{name}"
               required>

        <label for="price">Precio (€)</label>
        <input id="price"
               type="number"
               step="0.01"
               min="0"
               th:field="*{price}"
               required>

        <div class="acciones">

            <button type="submit">
                Guardar
            </button>

            <a class="boton" th:href="@{/products}">
                Cancelar
            </a>

        </div>

    </form>

</main>

</body>
</html>
