<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <nav th:replace="~{fragments/navigation :: menu}"></nav>
        <h1 class="text-center my-5">Catálogo de Productos</h1>
        <form th:action="@{/products/search}" method="get" class="row g-2 mb-4">
            <div class="col-sm">
                <label for="search-name" class="visually-hidden">Nombre del producto</label>
                <input id="search-name" name="name" class="form-control"
                       placeholder="Buscar por nombre" th:value="${searchName}">
            </div>
            <div class="col-sm-auto">
                <button type="submit" class="btn btn-primary">Buscar</button>
                <a th:href="@{/products}" class="btn btn-secondary">Mostrar todos</a>
            </div>
        </form>
        <p th:if="${#lists.isEmpty(products)}" class="alert alert-info">No hay productos disponibles.</p>
        <div class="row">
            <div th:each="product : ${products}" class="col-md-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${product.name}">Nombre del Producto</h5>
                        <p class="card-text" th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' €'">Precio</p>
                        <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                            <label th:for="${'quantity-' + product.id}" class="form-label">Cantidad</label>
                            <input th:id="${'quantity-' + product.id}" type="number" name="quantity"
                                   value="1" min="1" step="1" required class="form-control mb-2">
                            <button type="submit" class="btn btn-primary">Agregar al Carrito</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
